<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12141a">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<title>Weft</title>

<!--
  The shell, and nothing else.

  Every style and script is an external same-origin file, which is what lets the CSP be
  a plain 'self' with no nonces: no per-response HTML rewriting, and the browser gets to
  cache all of it across loads. The prototypes' single inline <style> and <script> were
  the only reason nonces were ever on the table.

  type="module" gives us many small files with no build step — no bundler, no npm, no
  watch process. Modules are deferred and strict-mode by default, so there is no
  `defer` attribute here and no "use strict" in any of them.
-->
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="app"></div>
<noscript>
  <div class="centre">
    <div class="card">
      <h1>Weft needs JavaScript</h1>
      <p>The client is a single page app; there is no server-rendered fallback.</p>
    </div>
  </div>
</noscript>
<script type="module" src="/js/main.js"></script>
</body>
</html>
