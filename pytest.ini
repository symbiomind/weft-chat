[pytest]
# /app is owned by root in the image while tests run as uid 1000, so the default
# in-tree .pytest_cache is unwritable and every run ends in a PytestCacheWarning that
# has nothing to do with the tests. Point it somewhere writable.
cache_dir = /tmp/weft-pytest-cache

# strict: async tests carry an explicit @pytest.mark.asyncio, matching ind-bridge.
# Auto mode silently collects any `async def test_` and hides a missing decorator as
# a passing no-op, which for a security suite is the wrong failure mode.
asyncio_mode = strict

testpaths = tests
