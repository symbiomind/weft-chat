# Alembic configuration for weft-service.
#
# Note what is NOT here: sqlalchemy.url. The URL comes from app.config at runtime
# (see alembic/env.py), because it is the same setting the application reads and
# having it in two places is how they drift. Postgres later is one line in config.yml,
# not one line here and one line there.

[alembic]
script_location = alembic
prepend_sys_path = .

# Timestamped revision filenames: chronological order is readable straight from ls,
# which matters when reviewing a migration history for security-relevant changes.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
